{% extends "layout.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block main %}
    <div id="movie-list" class="row row-cols-2 row-cols-md-4 g-4">
        {% for item in items %}
            <div class="col">
                <div class="movie">
                    <div class="movie-photos">
                        <img class="photo-1" src="{{ item.img1 }}" alt="{{ item.name }}">
                        <img class="photo-2" src="{{ item.img2 }}" alt="{{ item.name }}">
                    </div>
                    <p class="movie-name">{{ item.name }}</p>
                </div>
            </div>
        {% else %}
            <p>No entries yet.</p>
        {% endfor %}
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='items.js') }}"></script>
{% endblock %}

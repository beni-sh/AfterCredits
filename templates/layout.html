<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
        <title>{% block title %}AfterCredits{% endblock %}</title>
    </head>
    <body>
        <header class="site-header d-flex justify-content-between align-items-center px-4 py-3">
            <a id="title" class="site-title" href="{{ url_for('index') }}">AfterCredits</a>
            <ul id="navbar" class="list-unstyled d-flex gap-4 mb-0">
                <li><a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}"><i class="bi bi-house-door"></i> Home</a></li>
                <li><a href="{{ url_for('movies') }}" class="{{ 'active' if request.endpoint == 'movies' }}"><i class="bi bi-film"></i> Movies</a></li>
                <li><a href="{{ url_for('television') }}" class="{{ 'active' if request.endpoint == 'television' }}"><i class="bi bi-tv"></i> Television</a></li>
                <li><a href="{{ url_for('stars') }}" class="{{ 'active' if request.endpoint == 'stars' }}"><i class="bi bi-star"></i> Stars</a></li>
            </ul>
        </header>

        <main class="container my-5">
            {% block main %}{% endblock %}
        </main>

        {% block scripts %}{% endblock %}
    </body>
</html>
